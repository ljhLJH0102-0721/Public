<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>鸾尾花论坛</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#f8f8f8;--surface:#fff;--border:#e5e5e5;--border2:#d0d0d0;--text:#1a1a1a;--text2:#555;--text3:#999;--accent:#6a4e9c;--accent-h:#5a3e8c;--accent-bg:#f0ecf5;--radius:12px;--radius-s:8px;--shadow:0 2px 12px rgba(0,0,0,0.08);--shadow-h:0 8px 24px rgba(0,0,0,0.12);--heart:#ff4757;--danger:#e74c3c;--announce-bg:#f0ecf5;--announce-text:#3d2a5c}
    html{scroll-behavior:smooth}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .3s,color .3s}
    button{cursor:pointer;border:none;background:none;font-family:inherit}
    a{text-decoration:none;color:inherit}
    img{display:block}
    #announcement-bar{background:var(--announce-bg);color:var(--announce-text);padding:6px 16px;font-size:.85rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;border-bottom:1px solid var(--border);min-height:36px}
    #announcement-bar .announce-text{flex:1;display:flex;align-items:center;gap:12px;overflow-x:auto;white-space:nowrap}
    #announcement-bar .announce-text span{padding:2px 8px;border-radius:12px;background:rgba(106,78,156,0.12);font-size:.8rem}
    .ann-item{display:inline-flex;align-items:center;gap:6px}
    .ann-item .del-ann{color:#c0392b;font-size:.7rem;cursor:pointer;padding:0 4px;display:none}
    .ann-item .del-ann:hover{text-decoration:underline}
    .admin-mode .ann-item .del-ann{display:inline-block}
    .announce-actions{display:flex;gap:6px;align-items:center;flex-shrink:0}
    .announce-actions input{border:1px solid var(--border);border-radius:16px;padding:6px 16px;font-size:.85rem;background:#fff;outline:none;width:240px;min-width:120px}
    .announce-actions input:focus{border-color:var(--accent)}
    .announce-actions .btn-sm{padding:2px 12px;border-radius:16px;font-size:.75rem;background:var(--accent);color:#fff;font-weight:600}
    .announce-actions .btn-sm:hover{background:var(--accent-h)}
    .announce-empty{color:var(--text3);font-size:.8rem}
    header{position:sticky;top:0;z-index:200;background:rgba(255,255,255,0.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:12px;height:56px;transition:transform .3s}
    header.hidden{transform:translateY(-100%);pointer-events:none;height:0;padding:0;overflow:hidden}
    .logo{font-size:1.15rem;font-weight:700;color:var(--accent);white-space:nowrap;display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;transition:opacity .2s}
    .logo:active{opacity:.6}
    .logo svg{flex-shrink:0;width:28px;height:28px}
    .search-wrap{flex:1;max-width:420px;display:flex;align-items:center;background:var(--bg);border:1.5px solid var(--border);border-radius:24px;padding:0 14px;gap:6px;transition:border-color .2s;position:relative}
    .search-wrap:focus-within{border-color:var(--accent);background:#fff}
    .search-wrap input{flex:1;border:none;background:transparent;font-size:.85rem;color:var(--text);outline:none;padding:6px 0;font-family:inherit}
    .search-wrap input::placeholder{color:var(--text3)}
    #suggestions{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:var(--radius-s);box-shadow:var(--shadow);max-height:200px;overflow-y:auto;display:none;z-index:300}
    #suggestions .sug-item{padding:8px 14px;cursor:pointer;font-size:.85rem;color:var(--text);border-bottom:1px solid var(--bg)}
    #suggestions .sug-item:hover{background:var(--bg)}
    #suggestions .sug-item:last-child{border-bottom:none}
    .header-actions{display:flex;align-items:center;gap:8px;margin-left:auto;flex-shrink:0}
    .header-right{margin-left:auto;display:flex;align-items:center;gap:6px}
    .btn{display:inline-flex;align-items:center;gap:4px;padding:6px 14px;border-radius:24px;font-size:.8rem;font-weight:600;transition:all .18s;white-space:nowrap}
    .btn-primary{background:var(--accent);color:#fff}
    .btn-primary:hover{background:var(--accent-h);transform:translateY(-1px)}
    .btn-ghost{color:var(--text2);padding:6px 10px;border-radius:var(--radius-s)}
    .btn-ghost:hover{background:var(--bg);color:var(--text)}
    .btn-outline{background:#fff;color:var(--accent);border:1.5px solid var(--accent);padding:5px 13px;border-radius:24px;font-size:.8rem;font-weight:600}
    .btn-outline:hover{background:var(--accent);color:#fff}
    .btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}
    .user-avatar-btn{width:32px;height:32px;border-radius:50%;background:#ccc;color:#fff;font-size:.8rem;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;border:2px solid var(--border);transition:border-color .2s;position:relative}
    .user-avatar-btn.logged-in{background:var(--accent);border-color:transparent}
    .user-avatar-btn.logged-in:hover{border-color:var(--accent-h)}
    .user-avatar-wrap{position:relative}
    .user-dropdown{position:absolute;top:calc(100% + 8px);right:0;background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-h);min-width:200px;z-index:400;overflow:hidden;display:none}
    .user-dropdown.open{display:block}
    .user-dropdown-header{padding:12px 14px;border-bottom:1px solid var(--border)}
    .user-dropdown-header .ud-name{font-size:.88rem;font-weight:700;color:var(--text)}
    .user-dropdown-header .ud-email{font-size:.72rem;color:var(--text3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
    .user-dropdown-item{padding:10px 14px;font-size:.83rem;color:var(--text2);cursor:pointer;display:flex;align-items:center;gap:8px;transition:background .15s}
    .user-dropdown-item:hover{background:var(--bg);color:var(--text)}
    .user-dropdown-item.danger{color:var(--danger)}
    .user-dropdown-item.danger:hover{background:#fef2f2}
    .user-dropdown-item .toggle-label{display:flex;align-items:center;gap:10px;width:100%}
    .user-dropdown-item .toggle-label .toggle-track{width:36px;height:20px;background:#ccc;border-radius:10px;position:relative;transition:.2s;flex-shrink:0}
    .user-dropdown-item .toggle-label .toggle-track.active{background:var(--accent)}
    .user-dropdown-item .toggle-label .toggle-track .toggle-thumb{width:16px;height:16px;background:#fff;border-radius:50%;position:absolute;top:2px;left:2px;transition:.2s}
    .user-dropdown-item .toggle-label .toggle-track.active .toggle-thumb{left:18px}
    .hot-btn{background:var(--accent);color:#fff;border-radius:20px;padding:4px 14px;font-size:.8rem;font-weight:600;display:flex;align-items:center;gap:4px;cursor:pointer;transition:background .2s}
    .hot-btn:hover{background:var(--accent-h)}
    .hot-dropdown{display:none;position:absolute;top:calc(100% + 8px);right:0;background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-h);min-width:240px;z-index:401;overflow:hidden;max-height:400px;overflow-y:auto}
    .hot-dropdown.open{display:block}
    .hot-dropdown .hd-title{padding:12px 16px;font-weight:700;border-bottom:1px solid var(--border);background:var(--bg);font-size:.9rem;color:var(--text)}
    .hot-item{display:flex;align-items:center;padding:8px 16px;gap:10px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s}
    .hot-item:hover{background:var(--bg)}
    .hot-item .rank{width:24px;font-weight:700;color:var(--text3);font-size:.85rem;text-align:center}
    .hot-item .rank.top1{color:#ffd700}
    .hot-item .rank.top2{color:#c0c0c0}
    .hot-item .rank.top3{color:#cd7f32}
    .hot-item .info{flex:1;min-width:0}
    .hot-item .info .title{font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .hot-item .info .meta{font-size:.7rem;color:var(--text3)}
    .hot-item .likes{font-size:.8rem;color:var(--heart);font-weight:600}
    .hot-empty{padding:20px;text-align:center;color:var(--text3)}
    .hot-wrap{position:relative;display:inline-block}
    .tags-bar{background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px;padding:0 16px;height:44px;overflow-x:auto;transition:transform .3s,height .3s,padding .3s}
    .tags-bar.hidden{transform:translateY(-100%);pointer-events:none;height:0;padding:0;border:none;overflow:hidden}
    .tags-bar::-webkit-scrollbar{display:none}
    .tag-pill{flex-shrink:0;padding:4px 14px;border-radius:24px;font-size:.78rem;font-weight:500;border:1.5px solid var(--border);color:var(--text2);background:#fff;cursor:pointer;transition:all .18s;white-space:nowrap}
    .tag-pill:hover{border-color:var(--accent);color:var(--accent)}
    .tag-pill.active{background:var(--accent);border-color:var(--accent);color:#fff}
    .sort-select{margin-left:auto;flex-shrink:0;border:1.5px solid var(--border);border-radius:var(--radius-s);padding:4px 8px;font-size:.78rem;color:var(--text2);background:#fff;font-family:inherit;cursor:pointer;outline:none}
    .view-back-bar{display:none;padding:12px 16px;background:#fff;border-bottom:1px solid var(--border);align-items:center;gap:12px;position:sticky;top:0;z-index:150}
    .view-back-bar.show{display:flex}
    .view-back-bar .back-btn{font-size:1.1rem;color:var(--accent);cursor:pointer;font-weight:600;display:flex;align-items:center;gap:6px}
    .view-back-bar .back-btn:hover{text-decoration:underline}
    .view-back-bar .view-title{font-size:.95rem;font-weight:700;color:var(--text)}
    #main-view{display:block}
    #main-view.hidden{display:none}
    #gallery-wrap{padding:16px}
    #gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
    @media(min-width:700px){#gallery{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}}
    .artwork-card{border-radius:var(--radius);overflow:hidden;background:var(--surface);border:1px solid var(--border);cursor:pointer;transition:transform .15s ease,box-shadow .15s ease;will-change:transform;backface-visibility:hidden;position:relative}
    .artwork-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-h)}
    .card-img-wrap{overflow:hidden;background:#f0f0f0;position:relative}
    .card-img-wrap img{width:100%;display:block;aspect-ratio:1/1;object-fit:cover;transition:filter .15s}
    .artwork-card:hover .card-img-wrap img{filter:brightness(1.02)}
    .card-info{padding:10px 12px 12px;display:flex;justify-content:space-between;align-items:center}
    .card-left{flex:1;min-width:0}
    .card-title{font-size:.85rem;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .card-meta{font-size:.7rem;color:var(--text3);display:flex;gap:8px;align-items:center}
    .heart-btn{background:none;border:none;font-size:1.2rem;cursor:pointer;transition:transform .2s;padding:4px;line-height:1;flex-shrink:0;color:#ccc;display:flex;align-items:center;gap:4px}
    .heart-btn.liked{color:var(--heart)}
    .heart-btn:active{transform:scale(.85)}
    .heart-count{font-size:.75rem;color:var(--text3);font-weight:500}
    .card-tag{position:absolute;top:8px;left:8px;background:rgba(0,0,0,0.55);backdrop-filter:blur(4px);color:#fff;font-size:.6rem;padding:2px 8px;border-radius:10px;letter-spacing:.04em;border:1px solid rgba(255,255,255,0.15)}
    .empty{text-align:center;padding:60px 20px;color:var(--text3);grid-column:1/-1}
    .empty .empty-icon{font-size:3rem;margin-bottom:12px}
    .skeleton-card{border-radius:var(--radius);overflow:hidden;border:1px solid var(--border);background:#fff}
    .skeleton-img{height:170px;background:linear-gradient(90deg,#f0f0f0 25%,#e8e8e8 50%,#f0f0f0 75%);background-size:200% 100%;animation:shimmer 1.4s infinite}
    .skeleton-body{padding:10px 12px}
    .skeleton-line{height:12px;border-radius:6px;background:#f0f0f0;margin-bottom:6px}
    .skeleton-line.short{width:60%}
    @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
    #detail-view{display:none;background:#fff;min-height:100vh;padding:0 0 40px 0}
    #detail-view.open{display:block}
    .detail-header{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(255,255,255,0.95);backdrop-filter:blur(8px);z-index:50;gap:12px}
    .detail-back{font-size:1.1rem;color:var(--accent);cursor:pointer;font-weight:600;display:flex;align-items:center;gap:6px;flex-shrink:0}
    .detail-back:hover{text-decoration:underline}
    .detail-title{font-size:1.05rem;font-weight:700;color:var(--text);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .detail-body{max-width:820px;margin:0 auto;padding:20px}
    .detail-image-wrap{background:#f5f5f5;border-radius:var(--radius);overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:300px;position:relative;cursor:zoom-in}
    .detail-image-wrap img{max-width:100%;max-height:70vh;object-fit:contain;display:block;transition:transform .2s}
    .detail-image-wrap.zoomed{cursor:zoom-out}
    .detail-image-wrap.zoomed img{transform:scale(1.8);cursor:grab}
    .detail-image-wrap.zoomed img:active{cursor:grabbing}
    .detail-info{margin-top:20px}
    .detail-tag{display:inline-block;background:#eef6ff;color:var(--accent);font-size:.75rem;font-weight:600;padding:3px 12px;border-radius:12px}
    .detail-title-text{font-size:1.4rem;font-weight:800;color:var(--text);margin:8px 0 4px}
    .detail-date{font-size:.8rem;color:var(--text3);margin-bottom:12px}
    .detail-desc{font-size:.92rem;color:var(--text2);line-height:1.8;margin-bottom:16px;white-space:pre-wrap;word-break:break-word}
    .detail-actions{display:flex;align-items:center;gap:16px;padding:12px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-bottom:24px;flex-wrap:wrap}
    .detail-heart-btn{font-size:1.6rem;background:none;border:none;cursor:pointer;color:#ccc;transition:transform .2s;display:flex;align-items:center;gap:8px}
    .detail-heart-btn.liked{color:var(--heart)}
    .detail-heart-btn:active{transform:scale(.85)}
    .detail-heart-count{font-size:.95rem;color:var(--text2);font-weight:500}
    .detail-delete{margin-left:auto;color:var(--danger);border:1px solid var(--danger);padding:4px 14px;border-radius:var(--radius-s);font-size:.78rem;background:transparent;cursor:pointer;display:none;font-family:inherit}
    .detail-delete:hover{background:var(--danger);color:#fff}
    .comment-section{margin-top:20px}
    .cs-title{font-size:.9rem;font-weight:700;color:var(--text);margin-bottom:16px}
    .comment-input-wrap{display:flex;gap:10px;margin-bottom:20px}
    .comment-input-wrap textarea{flex:1;border:1.5px solid var(--border);border-radius:var(--radius-s);padding:10px 12px;font-size:.88rem;font-family:inherit;resize:none;outline:none;min-height:64px;background:var(--bg);transition:border-color .2s}
    .comment-input-wrap textarea:focus{border-color:var(--accent);background:#fff}
    .comment-input-wrap .submit-comment{align-self:flex-end;padding:8px 16px}
    .comment-login-tip{font-size:.85rem;color:var(--text3);padding:14px 0}
    .comment-login-tip a{color:var(--accent);cursor:pointer;font-weight:600}
    .comment-login-tip a:hover{text-decoration:underline}
    .comment-list{display:flex;flex-direction:column;gap:14px}
    .comment-item{display:flex;gap:10px}
    .comment-avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;font-size:.78rem;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .comment-body{flex:1;min-width:0}
    .comment-header{display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap}
    .comment-name{font-size:.82rem;font-weight:700;color:var(--text)}
    .comment-time{font-size:.72rem;color:var(--text3)}
    .comment-del{font-size:.7rem;color:var(--text3);cursor:pointer;padding:1px 6px;border-radius:4px;margin-left:auto}
    .comment-del:hover{background:#fef2f2;color:var(--danger)}
    .comment-text{font-size:.85rem;color:var(--text2);line-height:1.65;word-break:break-word;white-space:pre-wrap}
    .comment-empty{font-size:.85rem;color:var(--text3);text-align:center;padding:24px 0}
    .comment-loading{font-size:.82rem;color:var(--text3);text-align:center;padding:16px 0}
    .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:8px 20px;border-radius:24px;font-size:.8rem;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999}
    .toast.show{opacity:1}
    .toast.success{background:#27ae60}
    .toast.error{background:var(--danger)}
    .modal-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:600;align-items:center;justify-content:center;backdrop-filter:blur(4px);padding:20px}
    .modal-backdrop.open{display:flex}
    .modal{background:#fff;border-radius:16px;padding:24px;width:min(420px,100%);box-shadow:0 24px 64px rgba(0,0,0,0.2);max-height:95vh;overflow-y:auto}
    .modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
    .modal-title{font-size:1.05rem;font-weight:800}
    .modal-x{width:28px;height:28px;border-radius:50%;background:var(--bg);border:none;font-size:1rem;cursor:pointer}
    .form-row{margin-bottom:14px}
    .form-row label{display:block;font-size:.75rem;font-weight:600;color:var(--text2);margin-bottom:4px}
    .form-row input,.form-row textarea,.form-row select{width:100%;border:1.5px solid var(--border);border-radius:var(--radius-s);padding:8px 12px;font-size:.9rem;font-family:inherit;background:var(--bg);outline:none}
    .form-row input:focus,.form-row textarea:focus{border-color:var(--accent);background:#fff}
    .form-row textarea{min-height:70px;resize:vertical}
    .modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;border-top:1px solid var(--border);padding-top:16px}
    .modal-tabs{display:flex;gap:0;margin-bottom:20px;border:1.5px solid var(--border);border-radius:var(--radius-s);overflow:hidden}
    .modal-tab{flex:1;padding:8px;font-size:.85rem;font-weight:600;color:var(--text3);background:#fff;cursor:pointer;text-align:center;transition:all .18s;border:none;font-family:inherit}
    .modal-tab.active{background:var(--accent);color:#fff}
    .modal-tab-panel{display:none}
    .modal-tab-panel.active{display:block}
    .form-hint{font-size:.72rem;color:var(--text3);margin-top:4px}
    .form-error{font-size:.78rem;color:var(--danger);margin-top:6px;display:none}
    .form-error.show{display:block}
    .drop-zone{border:2px dashed var(--border2);border-radius:var(--radius);padding:24px 16px;text-align:center;cursor:pointer;transition:all .2s;color:var(--text3);position:relative;background:var(--bg)}
    .drop-zone:hover,.drop-zone.drag{border-color:var(--accent);background:#eef6ff;color:var(--accent)}
    .drop-zone input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
    .dz-icon{font-size:2rem;margin-bottom:6px}
    .dz-text{font-size:.85rem;font-weight:600}
    .dz-sub{font-size:.7rem;margin-top:4px}
    #preview-wrap{margin-top:10px;display:none;position:relative}
    #preview-wrap img{max-height:150px;max-width:100%;border-radius:var(--radius-s);object-fit:contain;border:1px solid var(--border)}
    .preview-remove{position:absolute;top:4px;right:4px;background:rgba(0,0,0,0.5);color:#fff;border-radius:50%;width:22px;height:22px;font-size:.7rem;border:none;cursor:pointer}
    .upload-progress{display:none;margin-top:12px}
    .progress-bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden}
    .progress-fill{height:100%;background:var(--accent);width:0%;transition:width .3s}
    .progress-text{font-size:.75rem;color:var(--text3);text-align:center;margin-top:4px}
    .admin-badge{display:inline-flex;align-items:center;gap:4px;background:#fff3cd;color:#856404;border:1px solid #ffc107;font-size:.7rem;font-weight:600;padding:2px 10px;border-radius:12px}
    .r18-badge{background:#ff6b6b;color:#fff;font-size:.6rem;padding:1px 6px;border-radius:8px;margin-left:6px}
    @media(max-width:480px){.header-right .btn span{display:none}#gallery{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}.card-info{padding:8px 10px}.detail-body{padding:12px}.detail-title-text{font-size:1.1rem}#announcement-bar{font-size:.75rem;padding:4px 12px}.announce-actions input{width:160px}.header-actions .hot-btn span{display:none}}
  </style>
</head>
<body>
  <div id="announcement-bar">
    <div class="announce-text" id="announce-text">
      <span>📢</span>
      <span class="announce-empty" id="announce-empty">暂无公告</span>
    </div>
    <div class="announce-actions" id="announce-actions" style="display:none;">
      <input type="text" id="announce-input" placeholder="新公告内容…" maxlength="200" />
      <button class="btn-sm" id="announce-post">发布</button>
    </div>

    // ---------- Supabase 封装 ----------
    const supa=(()=>{
      let _session=null;
      function saveSession(s){_session=s;if(s)localStorage.setItem('sb_session',JSON.stringify(s));else localStorage.removeItem('sb_session');}
      function loadSession(){try{const raw=localStorage.getItem('sb_session');if(raw){const s=JSON.parse(raw);if(s.expires_at&&Date.now()/1000<s.expires_at){_session=s;return true}localStorage.removeItem('sb_session')}}catch{}return false}
      function isTokenExpired(){if(!_session||!_session.expires_at)return true;return Date.now()/1000>=_session.expires_at-5}
      async function refreshToken(){if(!_session||!_session.refresh_token)throw new Error('无 refresh token');const res=await fetch(SUPA_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:SUPA_ANON,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:_session.refresh_token})});if(!res.ok){const err=await res.json().catch(()=>({}));throw new Error(err.msg||err.message||'刷新令牌失败')}const data=await res.json();data.expires_at=Math.floor(Date.now()/1000)+data.expires_in;data.user=_session.user;saveSession(data);return data}
      async function rest(method,table,{select,filters=[],body,returning=false}={}){
        let accessToken=null;

          if(isTokenExpired()){
            try{await refreshToken();}catch(e){saveSession(null);_session=null;}
          }
          if(_session) accessToken=_session.access_token;

        let url=SUPA_URL+'/rest/v1/'+table;
        const params=new URLSearchParams();
        if(select)params.set('select',select);
        filters.forEach(f=>params.set(f[0],f[1]));
        const headers={apikey:SUPA_ANON,'Content-Type':'application/json'};
        if(accessToken) headers['Authorization']='Bearer '+accessToken;
        if(returning) headers['Prefer']='return=representation';
        if([...params].length) url+='?'+params.toString();
        const opts={method,headers};
        if(body) opts.body=JSON.stringify(body);
        const res=await fetch(url,opts);
        if(!res.ok){
          let errMsg;
          try{const err=await res.json();errMsg=err.message||err.hint||'REST '+res.status}catch{errMsg='REST '+res.status}
          if(res.status===401&&(errMsg.includes('expired')||errMsg.includes('JWT'))){saveSession(null);_session=null;throw new Error('SESSION_EXPIRED')}
          throw new Error(errMsg);
        }
        const text=await res.text();
        return text?JSON.parse(text):null;
      }

      return{
        get session(){return _session},

        signIn: async (email,password)=>{const data=await authFetch('/token?grant_type=password',{email,password});if(data.access_token){data.expires_at=Math.floor(Date.now()/1000)+data.expires_in;saveSession(data)}return data},
        signOut: async ()=>{if(_session?.access_token){await fetch(SUPA_URL+'/auth/v1/logout',{method:'POST',headers:{apikey:SUPA_ANON,'Authorization':'Bearer '+_session.access_token}}).catch(()=>{})}saveSession(null)},
        getProfile: async (userId)=>{const rows=await rest('GET','profiles',{select:'id,nickname,avatar_url',filters:[['id','eq.'+userId]]});return rows?.[0]??null},
        updateNickname: async (userId,nickname)=>{await rest('PATCH','profiles',{filters:[['id','eq.'+userId]],body:{nickname}})},
        upsertProfile: async (userId,nickname)=>{await rest('POST','profiles',{body:{id:userId,nickname},returning:true})},
        getLikeCounts: async (artworkIds)=>{if(!artworkIds.length)return {};const rows=await rest('GET','likes',{select:'artwork_id',filters:[['artwork_id','in.('+artworkIds.join(',')+')']]});const counts={};(rows||[]).forEach(r=>{counts[r.artwork_id]=(counts[r.artwork_id]||0)+1});return counts},
        getUserLikes: async (userId,artworkIds)=>{if(!userId||!artworkIds.length)return new Set();const rows=await rest('GET','likes',{select:'artwork_id',filters:[['user_id','eq.'+userId],['artwork_id','in.('+artworkIds.join(',')+')']]});return new Set((rows||[]).map(r=>r.artwork_id))},
        addLike: async (userId,artworkId)=>{await rest('POST','likes',{body:{user_id:userId,artwork_id:artworkId}})},
        removeLike: async (userId,artworkId)=>{await rest('DELETE','likes',{filters:[['user_id','eq.'+userId],['artwork_id','eq.'+artworkId]]})},

        addComment: async (userId,artworkId,content)=>{const rows=await rest('POST','comments',{body:{user_id:userId,artwork_id:artworkId,content},returning:true});return rows?.[0]},

              toast('已迁移旧数据','success');

              return;
            }
          }catch(e){console.warn('迁移失败',e)}
        }
      }catch(e){
        console.error('loadArtworks error:',e);
        toast('加载作品失败，请检查Supabase表是否创建','error');
        artworks = [];
        applyFilters();
      }
    }

    async function loadLikeData(artworkIds){
      if(!artworkIds.length)return;
      try{
        likeCountsMap = await supa.getLikeCounts(artworkIds);
        if(supa.user) userLikedSet = await supa.getUserLikes(supa.user.id, artworkIds);
        else userLikedSet = new Set();
      }catch(e){console.warn('loadLikeData:',e)}
    }

    // ---------- 过滤与渲染 ----------
    function applyFilters(){
      let arr = [...artworks];
      if(!showR18) arr = arr.filter(a => !a.r18);
      if(isLikedView){
        const likedIds = Array.from(userLikedSet);
        arr = arr.filter(a => likedIds.includes(a.id));
      }else if(isHistoryView){
        const recent = getRecent();
        const recentIds = recent.map(r=>r.id);
        arr = arr.filter(a => recentIds.includes(a.id));
        const orderMap={}; recent.forEach((r,idx)=>orderMap[r.id]=idx);
        arr.sort((a,b)=>(orderMap[a.id]||Infinity)-(orderMap[b.id]||Infinity));
      }else{
        if(currentTag!=='all') arr = arr.filter(a=>a.tag===currentTag);
        if(searchQuery) arr = arr.filter(a=>a.title.toLowerCase().includes(searchQuery)||(a.description||'').toLowerCase().includes(searchQuery));
        if(currentSort==='newest') arr.sort((a,b)=>b.date-a.date);
        else if(currentSort==='oldest') arr.sort((a,b)=>a.date-b.date);
        else if(currentSort==='title') arr.sort((a,b)=>a.title.localeCompare(b.title,'zh'));
      }
      filtered = arr;
      renderGallery();
    }

    function showSkeletons(n=8){
      document.getElementById('gallery').innerHTML = Array.from({length:n},()=>'<div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-body"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>').join('');
    }

    function renderGallery(){
      const g=document.getElementById('gallery');
      if(!g)return;
      if(!filtered.length){
        let msg='还没有作品';
        if(isLikedView) msg='还没有喜欢的作品';

        g.innerHTML='<div class="empty"><div class="empty-icon">🖼️</div><p>'+msg+'</p></div>';
        return;
      }
      g.innerHTML='';
      filtered.forEach((art,idx)=>{
        const liked=isLiked(art.id);
        const count=getLikeCount(art.id);
        const card=document.createElement('div');
        card.className='artwork-card';
        let r18Badge = art.r18 ? '<span class="r18-badge">R18</span>' : '';
        card.innerHTML='<div class="card-img-wrap"><img src="'+art.imagePath+'" alt="'+escHtml(art.title)+'" loading="lazy" /><span class="card-tag">'+escHtml(art.tag)+'</span></div><div class="card-info"><div class="card-left"><div class="card-title">'+escHtml(art.title)+r18Badge+'</div><div class="card-meta">'+fmtDate(art.date)+'</div></div><button class="heart-btn '+(liked?'liked':'')+'" data-id="'+art.id+'">'+(liked?'❤️':'🤍')+'<span class="heart-count">'+count+'</span></button></div>';
        card.querySelector('.heart-btn').addEventListener('click',e=>{e.stopPropagation();handleLike(art.id,e.currentTarget)});
        card.addEventListener('click',()=>{openDetail(idx);addRecent(art)});

    // ---------- 点赞 ----------
    async function handleLike(artworkId,btn){
      if(!supa.user){openUserAuthModal();toast('请先登录才能点赞');return}
      const wasLiked=userLikedSet.has(artworkId);
      if(wasLiked){userLikedSet.delete(artworkId);likeCountsMap[artworkId]=Math.max(0,(likeCountsMap[artworkId]||0)-1)}
      else{userLikedSet.add(artworkId);likeCountsMap[artworkId]=(likeCountsMap[artworkId]||0)+1}
      function updateUI(){
        const nowLiked=userLikedSet.has(artworkId);
        if(btn){btn.innerHTML=(nowLiked?'❤️':'🤍')+'<span class="heart-count">'+(likeCountsMap[artworkId]||0)+'</span>';btn.classList.toggle('liked',nowLiked)}
        if(currentDetailArt?.id===artworkId){
          const dh=document.getElementById('detail-heart');
          dh.innerHTML=(nowLiked?'❤️':'🤍')+' <span class="detail-heart-count">'+(likeCountsMap[artworkId]||0)+'</span>';
          dh.classList.toggle('liked',nowLiked);
        }
      }
      updateUI();
      try{
        if(wasLiked) await supa.removeLike(supa.user.id, artworkId);
        else await supa.addLike(supa.user.id, artworkId);
      }catch(e){
        if(wasLiked){userLikedSet.add(artworkId);likeCountsMap[artworkId]=(likeCountsMap[artworkId]||0)+1}
        else{userLikedSet.delete(artworkId);likeCountsMap[artworkId]=Math.max(0,(likeCountsMap[artworkId]||0)-1)}
        updateUI();
        if(e.message==='SESSION_EXPIRED'){toast('登录已过期，请重新登录','error');supa.saveSession(null);updateUserUI()}
        else toast('点赞失败','error');
      }
    }

    async function loadComments(artworkId){
      const listEl=document.getElementById('comment-list');
      const loadingEl=document.getElementById('comment-loading');
      loadingEl.style.display='block';
      listEl.innerHTML='';
      try{
        const comments=await supa.getComments(artworkId);
        loadingEl.style.display='none';
        if(!comments.length){listEl.innerHTML='<div class="comment-empty">还没有评论，快来第一个发言吧 😊</div>';return}
        listEl.innerHTML='';
        comments.forEach(c=>{
          const nickname=c.profiles?.nickname||'匿名用户';
          const initial=[...nickname][0]||'?';
          const canDel=isOwner||(supa.user&&supa.user.id===c.user_id);
          const item=document.createElement('div');
          item.className='comment-item';
          item.innerHTML='<div class="comment-avatar" style="background:'+strColor(c.user_id)+'">'+escHtml(initial)+'</div><div class="comment-body"><div class="comment-header"><span class="comment-name">'+escHtml(nickname)+'</span><span class="comment-time">'+fmtDate(new Date(c.created_at).getTime())+'</span>'+(canDel?'<span class="comment-del" data-id="'+c.id+'">删除</span>':'')+'</div><div class="comment-text">'+escHtml(c.content)+'</div></div>';
          if(canDel){
            item.querySelector('.comment-del').addEventListener('click',async ()=>{
              if(!confirm('删除此评论？'))return;
              try{await supa.deleteComment(c.id);toast('已删除');await loadComments(artworkId)}catch{toast('删除失败','error')}
            });
          }
          listEl.appendChild(item);
        });
      }catch(e){
        loadingEl.style.display='none';
        listEl.innerHTML='<div class="comment-empty">评论加载失败</div>';
      }
    }
    function strColor(str){const colors=['#6a4e9c','#e67e22','#27ae60','#e74c3c','#2980b9','#8e44ad','#16a085','#d35400'];let h=0;for(const c of(str||''))h=(h*31+c.charCodeAt(0))&0xffffffff;return colors[Math.abs(h)%colors.length]}

    // ---------- 热度榜 ----------
    function renderHotList(){
      const container=document.getElementById('hot-list');
      if(!container)return;
      let list = artworks.slice();
      if(!showR18) list = list.filter(a=>!a.r18);
      const sorted=list.sort((a,b)=>(getLikeCount(b.id)-getLikeCount(a.id))).slice(0,10);
      if(!sorted.length){container.innerHTML='<div class="hot-empty">暂无作品</div>';return}
      container.innerHTML='';
      sorted.forEach((art,index)=>{
        const rank=index+1;
        const likeCount=getLikeCount(art.id);
        const rankClass=rank===1?'top1':rank===2?'top2':rank===3?'top3':'';
        const div=document.createElement('div');
        div.className='hot-item';
        div.innerHTML='<div class="rank '+rankClass+'">#'+rank+'</div><div class="info"><div class="title">'+escHtml(art.title)+(art.r18?' <span style="color:#ff6b6b;font-size:.7rem;">R18</span>':'')+'</div><div class="meta">'+escHtml(art.tag)+'</div></div><div class="likes">❤️ '+likeCount+'</div>';
        div.addEventListener('click',()=>{
          const idx=artworks.indexOf(art);
          if(idx!==-1){openDetail(idx);document.getElementById('hot-dropdown').classList.remove('open');}
        });
        container.appendChild(div);
      });
    }

    // ---------- 删除 ----------
    document.getElementById('detail-delete').addEventListener('click', async function(){
      if(!isOwner) return;
      if(!confirm('删除此作品？'))return;
      const id=this.dataset.id;
      const r18=this.dataset.r18==='true';

        if(r18 && imgPath){

    function handlePick(file){if(!file||!file.type.startsWith('image/'))return toast('请选图片');if(file.size>100*1024*1024)return toast('图片最大100MB');pickedFile=file;const reader=new FileReader();reader.onload=e=>{pickedDataUrl=e.target.result;previewImg.src=pickedDataUrl;previewWrap.style.display='block';dropZone.style.display='none'};reader.readAsDataURL(file)}
    if(fileInput)fileInput.addEventListener('change',e=>handlePick(e.target.files[0]));

    document.getElementById('upload-btn').addEventListener('click',function(){

    document.getElementById('upload-submit').addEventListener('click', async function(){
      const title=document.getElementById('art-title').value.trim();
      const tag=document.getElementById('art-tag').value;
      const desc=document.getElementById('art-desc').value.trim();
      const isR18 = document.getElementById('art-r18').checked && isOwner;
      if(!pickedFile)return toast('请选图');
      if(!title)return toast('请填标题');

      const btn=this;
      btn.disabled=true;btn.textContent='上传中…';

      try{
        let imageUrl;
        if(isR18){
          const token = getGitHubToken();
          if(!token){
            openModal('token-modal');
            btn.disabled=false;btn.textContent='发布';
            return;
          }
          const reader = new FileReader();
          const base64 = await new Promise((resolve,reject)=>{
            reader.onload=e=>resolve(e.target.result.split(',')[1]);
            reader.onerror=reject;
            reader.readAsDataURL(pickedFile);
          });
          const ext=(pickedFile.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');
          const path='images/'+Date.now()+'-'+Math.random().toString(36).slice(2,6)+'.'+ext;
          await ghPutFile(path, base64, 'add R18 '+title, null, token);
          imageUrl = `https://cdn.jsdelivr.net/gh/${GITHUB_OWNER}/${GITHUB_REPO}@${GITHUB_BRANCH}/${path}`;
        }else{
          const formData=new FormData();
          formData.append('file', pickedFile);
          formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
          const res=await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/upload`, {method:'POST', body:formData});
          if(!res.ok){const err=await res.json().catch(()=>({}));throw new Error(err.error?.message||'上传失败')}
          const data=await res.json();
          imageUrl=data.secure_url;
        }

        const artwork = {
          id: Date.now().toString(36)+'-'+Math.random().toString(36).slice(2),
          title, tag, description: desc, date: Date.now(),
          imagePath: imageUrl,
          r18: isR18,
          user_id: supa.user.id
        };
        await supa.rest('POST', 'artworks', {body: artwork, returning: true});
        artworks.unshift(artwork);
        closeModal('upload-modal');
        resetUploadForm();
        applyFilters();
        toast('发布成功！','success');
      }catch(e){
        toast('上传失败：'+e.message,'error');
      }finally{
        btn.disabled=false;btn.textContent='发布';
      }
    });

    document.getElementById('token-submit').addEventListener('click', function(){

    const BG_STORAGE_KEY='bg_color';
    function loadBg(){try{const color=localStorage.getItem(BG_STORAGE_KEY);if(color){document.body.style.background=color;const custom=document.getElementById('bg-custom-color');if(custom)custom.value=color;document.querySelectorAll('.bg-preset').forEach(el=>el.classList.toggle('active',el.dataset.color===color))}}catch{}}
    function saveBg(color){localStorage.setItem(BG_STORAGE_KEY,color);document.body.style.background=color;const custom=document.getElementById('bg-custom-color');if(custom)custom.value=color;document.querySelectorAll('.bg-preset').forEach(el=>el.classList.toggle('active',el.dataset.color===color))}
    document.querySelectorAll('.bg-preset').forEach(el=>{el.addEventListener('click',function(){saveBg(this.dataset.color)})});
    document.getElementById('bg-custom-color').addEventListener('input',function(){saveBg(this.value)});
    document.getElementById('bg-reset').addEventListener('click',function(){localStorage.removeItem(BG_STORAGE_KEY);document.body.style.background='';document.getElementById('bg-custom-color').value='#f5f3f0';document.querySelectorAll('.bg-preset').forEach(el=>el.classList.remove('active'));closeModal('bg-modal');toast('已恢复默认背景')});

    // ---------- 搜索 ----------
    function setupSearchSuggestions(){
      const input=document.getElementById('search-input');
      const sugg=document.getElementById('suggestions');
      if(!input||!sugg)return;
      input.addEventListener('input',function(){
        searchQuery=this.value.trim().toLowerCase();
        const val=searchQuery;
        if(!val){sugg.style.display='none';applyFilters();return}
        const matches=artworks.filter(a=>a.title.toLowerCase().includes(val)).slice(0,8);
        if(!matches.length){sugg.style.display='none';applyFilters();return}
        sugg.innerHTML=matches.map(a=>'<div class="sug-item" data-title="'+escHtml(a.title)+'">'+escHtml(a.title)+'</div>').join('');
        sugg.style.display='block';
        sugg.querySelectorAll('.sug-item').forEach(el=>{
          el.addEventListener('click',()=>{input.value=el.dataset.title;sugg.style.display='none';searchQuery=input.value.trim().toLowerCase();applyFilters()});
        });
        applyFilters();
      });
      document.addEventListener('click',e=>{if(!document.getElementById('search-wrap').contains(e.target))sugg.style.display='none'});
    }

    // ---------- 登录/注册 ----------
    function openUserAuthModal(tab='login'){document.querySelectorAll('.modal-tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===tab));document.querySelectorAll('.modal-tab-panel').forEach(p=>p.classList.toggle('active',p.id==='tab-'+tab));document.getElementById('login-error').classList.remove('show');document.getElementById('reg-error').classList.remove('show');openModal('user-auth-modal')}
    document.querySelectorAll('.modal-tab').forEach(tab=>{tab.addEventListener('click',()=>{document.querySelectorAll('.modal-tab').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.modal-tab-panel').forEach(p=>p.classList.remove('active'));tab.classList.add('active');document.getElementById('tab-'+tab.dataset.tab).classList.add('active')})});
    document.getElementById('user-auth-close').addEventListener('click',()=>closeModal('user-auth-modal'));
    document.getElementById('user-auth-cancel-login').addEventListener('click',()=>closeModal('user-auth-modal'));
    document.getElementById('user-auth-cancel-reg').addEventListener('click',()=>closeModal('user-auth-modal'));
    document.getElementById('login-submit').addEventListener('click',doUserLogin);
    document.getElementById('login-password').addEventListener('keydown',e=>{if(e.key==='Enter')doUserLogin()});
    async function doUserLogin(){const email=document.getElementById('login-email').value.trim();const password=document.getElementById('login-password').value;const errEl=document.getElementById('login-error');if(!email||!password){errEl.textContent='请填写邮箱和密码';errEl.classList.add('show');return}const btn=document.getElementById('login-submit');btn.disabled=true;btn.textContent='登录中…';try{await supa.signIn(email,password);await onUserLoggedIn();closeModal('user-auth-modal');toast('登录成功，欢迎回来！','success')}catch(e){errEl.textContent='登录失败：'+e.message;errEl.classList.add('show')}finally{btn.disabled=false;btn.textContent='登录'}}
    document.getElementById('register-submit').addEventListener('click',doUserRegister);
    async function doUserRegister(){const nickname=document.getElementById('reg-nickname').value.trim();const email=document.getElementById('reg-email').value.trim();const password=document.getElementById('reg-password').value;const errEl=document.getElementById('reg-error');if(!nickname){errEl.textContent='请输入昵称';errEl.classList.add('show');return}if(!email){errEl.textContent='请输入邮箱';errEl.classList.add('show');return}if(password.length<6){errEl.textContent='密码至少6位';errEl.classList.add('show');return}const btn=document.getElementById('register-submit');btn.disabled=true;btn.textContent='注册中…';try{const data=await supa.signUp(email,password,nickname);if(data.access_token){await onUserLoggedIn();closeModal('user-auth-modal');toast('注册成功，欢迎加入！','success')}else{closeModal('user-auth-modal');toast('注册成功！请查收邮件并完成验证后登录','success')}}catch(e){errEl.textContent='注册失败：'+e.message;errEl.classList.add('show')}finally{btn.disabled=false;btn.textContent='注册'}}

    // ---------- 事件绑定 ----------
    document.getElementById('detail-back').addEventListener('click', closeDetail);
    document.getElementById('detail-heart').addEventListener('click', function(){if(!currentDetailArt)return;handleLike(currentDetailArt.id,null);const card=document.querySelector('.heart-btn[data-id="'+currentDetailArt.id+'"]');if(card){const nowLiked=userLikedSet.has(currentDetailArt.id);const count=likeCountsMap[currentDetailArt.id]||0;card.innerHTML=(nowLiked?'❤️':'🤍')+'<span class="heart-count">'+count+'</span>';card.classList.toggle('liked',nowLiked)}});
    document.querySelectorAll('.tag-pill').forEach(btn=>{btn.addEventListener('click',()=>{if(isLikedView||isHistoryView)exitSpecialView();document.querySelectorAll('.tag-pill').forEach(b=>b.classList.remove('active'));btn.classList.add('active');currentTag=btn.dataset.tag;applyFilters()})});
    document.getElementById('sort-select').addEventListener('change',e=>{currentSort=e.target.value;applyFilters()});
    document.getElementById('view-back-btn').addEventListener('click', exitSpecialView);
    document.querySelector('.logo').addEventListener('dblclick',()=>{document.getElementById('search-input').value='';searchQuery='';document.querySelectorAll('.tag-pill').forEach(b=>b.classList.remove('active'));document.querySelector('.tag-pill[data-tag="all"]').classList.add('active');currentTag='all';if(isLikedView||isHistoryView)exitSpecialView();if(document.getElementById('detail-view').classList.contains('open'))closeDetail();loadArtworks();window.scrollTo({top:0,behavior:'smooth'});toast('已刷新')});
    const hotBtn=document.getElementById('hot-btn');
    if(hotBtn){hotBtn.addEventListener('click',function(e){e.stopPropagation();renderHotList();document.getElementById('hot-dropdown').classList.toggle('open')});}
    document.addEventListener('click',function(e){if(!e.target.closest('.hot-wrap')){const dd=document.getElementById('hot-dropdown');if(dd)dd.classList.remove('open')}});
    document.getElementById('user-avatar-btn').addEventListener('click',function(e){e.stopPropagation();document.getElementById('user-dropdown').classList.toggle('open')});
    document.addEventListener('click',function(e){if(!e.target.closest('.user-avatar-wrap')){const dd=document.getElementById('user-dropdown');if(dd)dd.classList.remove('open')}});
    document.getElementById('nick-close').addEventListener('click',()=>closeModal('nick-modal'));
    document.getElementById('nick-cancel').addEventListener('click',()=>closeModal('nick-modal'));
    document.getElementById('nick-submit').addEventListener('click',async()=>{const name=document.getElementById('nick-input').value.trim();if(!name){toast('昵称不能为空');return}const btn=document.getElementById('nick-submit');btn.disabled=true;btn.textContent='保存中…';try{await supa.updateNickname(supa.user.id,name);if(currentUserProfile)currentUserProfile.nickname=name;updateUserUI();closeModal('nick-modal');toast('昵称已更新','success')}catch{toast('更新失败','error')}finally{btn.disabled=false;btn.textContent='保存'}});
    document.getElementById('admin-btn')?.addEventListener('click', ()=>{toast('管理员登录已移除，请使用普通登录')});
    ['upload-modal','auth-modal','user-auth-modal','nick-modal','bg-modal','token-modal'].forEach(id=>{
      const el=document.getElementById(id);
      if(el){el.addEventListener('click',e=>{if(e.target===el)closeModal(id)})}
    });

    // ---------- 公告 ----------
    let announcements=[],annSha=null;const ANN_FILE='announcements.json';
    async function fetchAnnouncements(){
      try{
        const token = getGitHubToken();
        if(!token){renderAnnouncements();return}
        const file=await ghGetFile(ANN_FILE, token);
        if(file){annSha=file.sha;const bin=atob(file.content.replace(/\s/g,''));announcements=JSON.parse(decodeURIComponent(escape(bin)))}else{announcements=[]}
      }catch{announcements=[]}
      renderAnnouncements();
    }
    async function saveAnnouncements(token){const json=JSON.stringify(announcements,null,2);const b64=btoa(unescape(encodeURIComponent(json)));const r=await ghPutFile(ANN_FILE,b64,'update announcements',annSha,token);annSha=r.content.sha}
    function renderAnnouncements(){const container=document.getElementById('announce-text');const empty=document.getElementById('announce-empty');while(container.children.length>2)container.removeChild(container.lastChild);if(!announcements.length){empty.style.display='inline';return}empty.style.display='none';announcements.forEach(ann=>{const w=document.createElement('span');w.className='ann-item';w.innerHTML='<span>'+escHtml(ann.text)+'</span><span class="del-ann" data-id="'+ann.id+'">✕</span>';container.appendChild(w)});container.querySelectorAll('.del-ann').forEach(el=>{el.addEventListener('click',async e=>{e.stopPropagation();if(!isOwner){toast('仅站长可删除公告');return}if(!confirm('删除此公告？'))return;announcements=announcements.filter(a=>a.id!==el.dataset.id);await saveAnnouncements(getGitHubToken());renderAnnouncements();toast('公告已删除')})});if(isOwner){document.getElementById('announcement-bar').classList.add('admin-mode');document.getElementById('announce-actions').style.display='flex'}else{document.getElementById('announcement-bar').classList.remove('admin-mode');document.getElementById('announce-actions').style.display='none'}}
    document.getElementById('announce-post').addEventListener('click',async()=>{if(!isOwner){toast('仅站长可发布公告');return}const input=document.getElementById('announce-input');const text=input.value.trim();if(!text){toast('请输入公告内容');return}announcements.push({id:Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,6),text,date:Date.now()});await saveAnnouncements(getGitHubToken());renderAnnouncements();input.value='';toast('公告发布成功','success')});
    document.getElementById('announce-input').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('announce-post').click()});

    // ---------- 初始化 ----------
    document.addEventListener('DOMContentLoaded', function(){
      (async()=>{
        if(supa.loadSession()){
          try{await onUserLoggedIn();}catch{supa.saveSession(null);updateUserUI()}
        }else{updateUserUI()}
        loadBg();
        setupSearchSuggestions();
        await loadArtworks();
        await fetchAnnouncements();
      })();
    });
  </script>
</body>
</html>
