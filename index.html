<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>鸾尾花论坛 · 画作展示</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    :root {
      --bg: #f8f8f8;
      --surface: #ffffff;
      --border: #e5e5e5;
      --border2: #d0d0d0;
      --text: #1a1a1a;
      --text2: #555;
      --text3: #999;
      --accent: #6a4e9c;
      --accent-h: #5a3e8c;
      --radius: 12px;
      --radius-s: 8px;
      --shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      --shadow-h: 0 8px 24px rgba(0, 0, 0, 0.12);
      --heart: #ff4757;
      --announce-bg: #f0ecf5;
      --announce-text: #3d2a5c;
    }
    html {
      scroll-behavior: smooth;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      margin: 0;
      padding: 0;
    }
    button {
      cursor: pointer;
      border: none;
      background: none;
      font-family: inherit;
    }
    a {
      text-decoration: none;
      color: inherit;
    }
    img {
      display: block;
    }

    #announcement-bar {
      background: var(--announce-bg);
      color: var(--announce-text);
      padding: 6px 16px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      border-bottom: 1px solid var(--border);
      min-height: 36px;
    }
    #announcement-bar .announce-text {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 12px;
      overflow-x: auto;
      white-space: nowrap;
    }
    #announcement-bar .announce-text span {
      padding: 2px 8px;
      border-radius: 12px;
      background: rgba(106, 78, 156, 0.12);
      font-size: 0.8rem;
    }
    #announcement-bar .announce-text .ann-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    #announcement-bar .announce-text .ann-item .del-ann {
      color: #c0392b;
      font-size: 0.7rem;
      cursor: pointer;
      padding: 0 4px;
      display: none;
    }
    #announcement-bar .announce-text .ann-item .del-ann:hover {
      text-decoration: underline;
    }
    .admin-mode .announce-text .ann-item .del-ann {
      display: inline-block;
    }
    .announce-actions {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-shrink: 0;
    }
    .announce-actions input {
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 6px 16px;
      font-size: 0.85rem;
      background: #fff;
      outline: none;
      width: 240px;
      min-width: 120px;
    }
    .announce-actions input:focus {
      border-color: var(--accent);
    }
    .announce-actions .btn-sm {
      padding: 2px 12px;
      border-radius: 16px;
      font-size: 0.75rem;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
    }
    .announce-actions .btn-sm:hover {
      background: var(--accent-h);
    }
    .announce-empty {
      color: var(--text3);
      font-size: 0.8rem;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 200;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
      height: 56px;
      transition: transform 0.3s;
    }
    header.hidden {
      transform: translateY(-100%);
      pointer-events: none;
      height: 0;
      padding: 0;
      overflow: hidden;
    }
    .logo {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--accent);
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
      transition: opacity 0.2s;
    }
    .logo:active {
      opacity: 0.6;
    }
    .logo svg {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
    }

    .search-wrap {
      flex: 1;
      max-width: 420px;
      display: flex;
      align-items: center;
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 24px;
      padding: 0 14px;
      gap: 6px;
      transition: border-color .2s;
      position: relative;
    }
    .search-wrap:focus-within {
      border-color: var(--accent);
      background: #fff;
    }
    .search-wrap input {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 0.85rem;
      color: var(--text);
      outline: none;
      padding: 6px 0;
      font-family: inherit;
    }
    .search-wrap input::placeholder {
      color: var(--text3);
    }

    #suggestions {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius-s);
      box-shadow: var(--shadow);
      max-height: 200px;
      overflow-y: auto;
      display: none;
      z-index: 300;
    }
    #suggestions .sug-item {
      padding: 8px 14px;
      cursor: pointer;
      font-size: 0.85rem;
      color: var(--text);
      border-bottom: 1px solid var(--bg);
    }
    #suggestions .sug-item:hover {
      background: var(--bg);
    }
    #suggestions .sug-item:last-child {
      border-bottom: none;
    }

    .header-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 14px;
      border-radius: 24px;
      font-size: 0.8rem;
      font-weight: 600;
      transition: all .18s;
      white-space: nowrap;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover {
      background: var(--accent-h);
      transform: translateY(-1px);
    }
    .btn-ghost {
      color: var(--text2);
      padding: 6px 10px;
      border-radius: var(--radius-s);
    }
    .btn-ghost:hover {
      background: var(--bg);
      color: var(--text);
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
    }

    .tags-bar {
      background: #fff;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 16px;
      height: 44px;
      overflow-x: auto;
      transition: transform 0.3s, height 0.3s, padding 0.3s;
    }
    .tags-bar.hidden {
      transform: translateY(-100%);
      pointer-events: none;
      height: 0;
      padding: 0;
      border: none;
      overflow: hidden;
    }
    .tags-bar::-webkit-scrollbar {
      display: none;
    }
    .tag-pill {
      flex-shrink: 0;
      padding: 4px 14px;
      border-radius: 24px;
      font-size: 0.78rem;
      font-weight: 500;
      border: 1.5px solid var(--border);
      color: var(--text2);
      background: #fff;
      cursor: pointer;
      transition: all .18s;
      white-space: nowrap;
    }
    .tag-pill:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .tag-pill.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .sort-select {
      margin-left: auto;
      flex-shrink: 0;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-s);
      padding: 4px 8px;
      font-size: 0.78rem;
      color: var(--text2);
      background: #fff;
      font-family: inherit;
      cursor: pointer;
      outline: none;
    }

    .view-back-bar {
      display: none;
      padding: 12px 16px;
      background: #fff;
      border-bottom: 1px solid var(--border);
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 150;
    }
    .view-back-bar.show {
      display: flex;
    }
    .view-back-bar .back-btn {
      font-size: 1.1rem;
      color: var(--accent);
      cursor: pointer;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .view-back-bar .back-btn:hover {
      text-decoration: underline;
    }
    .view-back-bar .view-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text);
    }

    #main-view {
      display: block;
    }
    #main-view.hidden {
      display: none;
    }

    #gallery-wrap {
      padding: 16px;
    }
    #gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 14px;
    }
    @media (min-width: 700px) {
      #gallery {
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      }
    }

    .artwork-card {
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      will-change: transform;
      backface-visibility: hidden;
      position: relative;
    }
    .artwork-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-h);
    }
    .card-img-wrap {
      overflow: hidden;
      background: #f0f0f0;
      position: relative;
    }
    .card-img-wrap img {
      width: 100%;
      display: block;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      transition: filter 0.15s;
    }
    .artwork-card:hover .card-img-wrap img {
      filter: brightness(1.02);
    }

    .card-info {
      padding: 10px 12px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-left {
      flex: 1;
      min-width: 0;
    }
    .card-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-meta {
      font-size: 0.7rem;
      color: var(--text3);
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .heart-btn {
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      transition: transform .2s;
      padding: 4px;
      line-height: 1;
      flex-shrink: 0;
      color: #ccc;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .heart-btn.liked {
      color: var(--heart);
    }
    .heart-btn:active {
      transform: scale(0.85);
    }
    .heart-count {
      font-size: 0.75rem;
      color: var(--text3);
      font-weight: 500;
    }

    .card-tag {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(4px);
      color: #fff;
      font-size: 0.6rem;
      padding: 2px 8px;
      border-radius: 10px;
      letter-spacing: 0.04em;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--text3);
      grid-column: 1 / -1;
    }
    .empty .empty-icon {
      font-size: 3rem;
      margin-bottom: 12px;
    }
    .skeleton-card {
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
      background: #fff;
    }
    .skeleton-img {
      height: 170px;
      background: linear-gradient(90deg, #f0f0f0 25%, #e8e8e8 50%, #f0f0f0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }
    .skeleton-body {
      padding: 10px 12px;
    }
    .skeleton-line {
      height: 12px;
      border-radius: 6px;
      background: #f0f0f0;
      margin-bottom: 6px;
    }
    .skeleton-line.short {
      width: 60%;
    }
    @keyframes shimmer {
      0% {
        background-position: 200% 0;
      }
      100% {
        background-position: -200% 0;
      }
    }

    .bottom-strip {
      background: #fff;
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      margin-top: 0;
      transition: transform 0.3s, opacity 0.3s, height 0.3s, padding 0.3s;
    }
    .bottom-strip.hidden {
      transform: translateY(100%);
      opacity: 0;
      pointer-events: none;
      height: 0;
      padding: 0;
      border: none;
      overflow: hidden;
    }
    .strip-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .strip-title {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .strip-more {
      font-size: 0.7rem;
      color: var(--accent);
      cursor: pointer;
      font-weight: 600;
    }
    .strip-more:hover {
      text-decoration: underline;
    }
    .strip-list {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .strip-list::-webkit-scrollbar {
      height: 3px;
    }
    .strip-list::-webkit-scrollbar-thumb {
      background: var(--border2);
      border-radius: 2px;
    }
    .strip-item {
      flex-shrink: 0;
      width: 60px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: transform .2s;
      background: var(--bg);
      position: relative;
    }
    .strip-item:hover {
      transform: scale(1.04);
    }
    .strip-item img {
      width: 60px;
      height: 60px;
      object-fit: cover;
      display: block;
    }
    .strip-item .si-title {
      font-size: 0.5rem;
      color: var(--text3);
      text-align: center;
      padding: 2px 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      background: rgba(255, 255, 255, 0.8);
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
    }
    .strip-empty {
      font-size: 0.75rem;
      color: #bbb;
      padding: 6px 0;
    }

    #detail-view {
      display: none;
      background: #fff;
      min-height: 100vh;
      padding: 0 0 40px 0;
    }
    #detail-view.open {
      display: block;
    }

    .detail-header {
      display: flex;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      z-index: 50;
      gap: 12px;
    }
    .detail-back {
      font-size: 1.1rem;
      color: var(--accent);
      cursor: pointer;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .detail-back:hover {
      text-decoration: underline;
    }
    .detail-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .detail-body {
      max-width: 820px;
      margin: 0 auto;
      padding: 20px;
    }

    .detail-image-wrap {
      background: #f5f5f5;
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 300px;
      position: relative;
      cursor: zoom-in;
    }
    .detail-image-wrap img {
      max-width: 100%;
      max-height: 70vh;
      object-fit: contain;
      display: block;
      transition: transform 0.2s;
    }
    .detail-image-wrap.zoomed {
      cursor: zoom-out;
    }
    .detail-image-wrap.zoomed img {
      transform: scale(1.8);
      cursor: grab;
    }
    .detail-image-wrap.zoomed img:active {
      cursor: grabbing;
    }

    .detail-info {
      margin-top: 20px;
    }
    .detail-tag {
      display: inline-block;
      background: #eef6ff;
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 3px 12px;
      border-radius: 12px;
    }
    .detail-title-text {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--text);
      margin: 8px 0 4px;
    }
    .detail-date {
      font-size: 0.8rem;
      color: var(--text3);
      margin-bottom: 12px;
    }
    .detail-desc {
      font-size: 0.92rem;
      color: var(--text2);
      line-height: 1.8;
      margin-bottom: 16px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .detail-uploader {
      font-size: 0.75rem;
      color: var(--text3);
      margin-top: 4px;
    }

    .detail-actions {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 0;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .detail-heart-btn {
      font-size: 1.6rem;
      background: none;
      border: none;
      cursor: pointer;
      color: #ccc;
      transition: transform .2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .detail-heart-btn.liked {
      color: var(--heart);
    }
    .detail-heart-btn:active {
      transform: scale(0.85);
    }
    .detail-heart-count {
      font-size: 0.95rem;
      color: var(--text2);
      font-weight: 500;
    }

    .detail-delete {
      margin-left: auto;
      color: var(--danger);
      border: 1px solid var(--danger);
      padding: 4px 14px;
      border-radius: var(--radius-s);
      font-size: 0.78rem;
      background: transparent;
      cursor: pointer;
      display: none;
      font-family: inherit;
    }
    .detail-delete:hover {
      background: var(--danger);
      color: #fff;
    }

    .comment-section {
      margin-top: 20px;
    }
    .comment-section .cs-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 16px;
    }
    .giscus {
      width: 100%;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #333;
      color: #fff;
      padding: 8px 20px;
      border-radius: 24px;
      font-size: 0.8rem;
      opacity: 0;
      transition: opacity .3s;
      pointer-events: none;
      z-index: 999;
    }
    .toast.show {
      opacity: 1;
    }

    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 600;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
      padding: 20px;
    }
    .modal-backdrop.open {
      display: flex;
    }
    .modal {
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      width: min(400px, 100%);
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.2);
      max-height: 95vh;
      overflow-y: auto;
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .modal-title {
      font-size: 1.05rem;
      font-weight: 800;
    }
    .modal-x {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--bg);
      border: none;
      font-size: 1rem;
      cursor: pointer;
    }
    .form-row {
      margin-bottom: 14px;
    }
    .form-row label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text2);
      margin-bottom: 4px;
    }
    .form-row input,
    .form-row textarea,
    .form-row select {
      width: 100%;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-s);
      padding: 8px 12px;
      font-size: 0.9rem;
      font-family: inherit;
      background: var(--bg);
      outline: none;
    }
    .form-row input:focus,
    .form-row textarea:focus {
      border-color: var(--accent);
      background: #fff;
    }
    .form-row textarea {
      min-height: 70px;
      resize: vertical;
    }
    .modal-footer {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 16px;
      border-top: 1px solid var(--border);
      padding-top: 16px;
    }
    .drop-zone {
      border: 2px dashed var(--border2);
      border-radius: var(--radius);
      padding: 24px 16px;
      text-align: center;
      cursor: pointer;
      transition: all .2s;
      color: var(--text3);
      position: relative;
      background: var(--bg);
    }
    .drop-zone:hover,
    .drop-zone.drag {
      border-color: var(--accent);
      background: #eef6ff;
      color: var(--accent);
    }
    .drop-zone input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }
    .dz-icon {
      font-size: 2rem;
      margin-bottom: 6px;
    }
    .dz-text {
      font-size: 0.85rem;
      font-weight: 600;
    }

  <div class="modal-backdrop" id="first-setup-modal">
    <div class="modal" style="max-width:360px;">
      <div class="modal-header"><span class="modal-title">📝 完善信息</span></div>
      <p style="font-size:0.85rem;color:var(--text2);margin-bottom:16px;">为了绑定唯一邮箱，请填写以下信息（仅需一次）。</p>
      <div class="form-row"><label>显示名（昵称）</label><input type="text" id="first-displayname" placeholder="显示名" /></div>
      <div class="form-row"><label>邮箱 *</label><input type="email" id="first-email" placeholder="邮箱" /></div>
      <div class="modal-footer"><button class="btn btn-primary" id="first-submit">保存并继续</button></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://www.unpkg.com/userbase-js@2.7.0/dist/userbase.js">
  </script>

  <script>
    'use strict';

    const USERBASE_APP_ID = '6c6e05da-87ac-4af4-afdd-69719d48a0d1';
    const IMGBB_API_KEY = '36bdc3532d8eb5a1eaa72d6f022fd087';
    const ADMIN_USERNAME = 'admin';

    const GISCUS_CONFIG = {
      repo: 'ljhLJH0102-0721/Public',
      repoId: 'R_kgDOUEWNDg',
      category: 'Announcements',
      categoryId: 'DIC_kwDOUEWNDs4DENWa',
      strict: '0',
      reactionsEnabled: '1',
      emitMetadata: '0',
      inputPosition: 'top',
      theme: 'light',
      lang: 'zh-CN',
      loading: 'lazy'
    };

    const RECENT_KEY = 'ag_recent';

    function getRecent() {
      try { return JSON.parse(localStorage.getItem(RECENT_KEY)) || []; } catch { return []; }
    }

    function saveRecent(recent) { localStorage.setItem(RECENT_KEY, JSON.stringify(recent)); }

    function addRecent(art) {
      let recent = getRecent();
      recent = recent.filter(item => item.id !== art.id);
      recent.unshift({ id: art.id, title: art.title, imagePath: art.imageUrl });
      if (recent.length > 20) recent = recent.slice(0, 20);
      saveRecent(recent);
      renderRecentStrip();
    }

    let db = null;
    let artworks = [];
    let announcements = [];
    let currentUser = null;
    let currentUserInfo = null;
    let isAdmin = false;

    async function initUserbase() {
      try {
        await userbase.init({ appId: USERBASE_APP_ID });

        // 修复：使用 getCurrentUser 代替 getSession
        const user = await userbase.getCurrentUser();
        if (user) {
          currentUser = user;
          await loadUserInfo(user.username);
          isAdmin = (currentUser.username === ADMIN_USERNAME);
          updateUIForLoggedIn();
          if (!currentUserInfo || !currentUserInfo.email || !currentUserInfo.displayName) {
            openModal('first-setup-modal');
          }
        } else {
          updateUIForLoggedOut();
        }

        db = await userbase.openDatabase({
          databaseName: 'gallery-data',
          changeHandler: function(items) {
            loadAllData();
          }
        });

        await loadAllData();

      } catch (e) {
        console.error('Userbase init error:', e);
        toast('初始化失败：' + e.message, 'error');
      }
    }

    async function loadUserInfo(username) {
      if (!db) return;
      try {
        const items = await db.getItems();
        const userItem = items.find(item => item.itemName === 'user' && item.data.username === username);
        if (userItem) {
          currentUserInfo = userItem.data;
        } else {
          currentUserInfo = null;
        }
      } catch (e) {
        currentUserInfo = null;
      }
    }

    async function saveUserInfo(data) {
      if (!db) throw new Error('数据库未初始化');
      const items = await db.getItems();
      const existing = items.find(item => item.itemName === 'user' && item.data.username === data.username);
      if (existing) {
        await db.updateItem({ itemName: 'user', itemId: existing.itemId, data: { ...existing.data, ...data } });
      } else {
        await db.insertItem({ itemName: 'user', data });
      }
      currentUserInfo = { ...currentUserInfo, ...data };
    }

    async function isEmailTaken(email, excludeUsername = null) {
      if (!db) return false;
      const items = await db.getItems();
      const userItems = items.filter(item => item.itemName === 'user');
      return userItems.some(item => item.data.email === email && item.data.username !== excludeUsername);
    }

    async function loadAllData() {
      if (!db) return;
      try {
        const items = await db.getItems();
        const artItems = items.filter(item => item.itemName === 'artwork');
        const annItems = items.filter(item => item.itemName === 'announcement');

        artworks = artItems.map(item => item.data);
        announcements = annItems.map(item => item.data);

        artworks.sort((a, b) => b.date - a.date);
        announcements.sort((a, b) => b.date - a.date);

        applyFilters();
        renderRecentStrip();
        renderLikedStrip();
        renderAnnouncements();
      } catch (e) {
        console.error('加载数据失败:', e);
        toast('加载数据失败', 'error');
      }
    }

    async function upsertItem(itemName, data, id) {
      if (!db) throw new Error('数据库未初始化');
      if (id) {
        await db.updateItem({ itemName, itemId: id, data });
      } else {
        await db.insertItem({ itemName, data });
      }
    }

    async function deleteItem(itemName, id) {
      if (!db) throw new Error('数据库未初始化');
      await db.deleteItem({ itemName, itemId: id });
    }

    function genId() {
      return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 6);
    }

    function updateUIForLoggedIn() {
      const displayName = currentUserInfo && currentUserInfo.displayName ? currentUserInfo.displayName : currentUser
        .username;
      const authSection = document.getElementById('auth-section');
      authSection.innerHTML = `
        <span style="color:var(--text2);font-size:0.8rem;margin-right:6px;cursor:pointer;" onclick="openSettings()">👤 ${escHtml(displayName)}</span>
        <button class="btn btn-ghost" onclick="signOut()">退出</button>
      `;
      if (isAdmin) {
        document.getElementById('admin-badge').style.display = 'inline-flex';
        document.getElementById('announce-actions').style.display = 'flex';
        document.getElementById('announcement-bar').classList.add('admin-mode');
        document.getElementById('upload-btn').style.display = '';
      } else {
        document.getElementById('upload-btn').style.display = '';
      }
      renderAnnouncements();
    }

    function updateUIForLoggedOut() {
      const authSection = document.getElementById('auth-section');
      authSection.innerHTML = `
        <button class="btn btn-ghost" onclick="showLoginModal()">登录</button>
        <button class="btn btn-primary" onclick="showSignupModal()">注册</button>
      `;
      document.getElementById('admin-badge').style.display = 'none';
      document.getElementById('announce-actions').style.display = 'none';
      document.getElementById('upload-btn').style.display = 'none';
      document.getElementById('announcement-bar').classList.remove('admin-mode');
      renderAnnouncements();
    }

    async function signUp(username, password, email) {
      try {
        const taken = await isEmailTaken(email);
        if (taken) {
          toast('该邮箱已被注册', 'error');
          throw new Error('邮箱已被注册');
        }
        const user = await userbase.signUp({ username, password, email, rememberMe: 'session' });
        await saveUserInfo({
          username: user.username,
          email: email,
          displayName: username
        });
        currentUser = user;
        currentUserInfo = { username: user.username, email, displayName: username };
        isAdmin = (user.username === ADMIN_USERNAME);
        updateUIForLoggedIn();
        toast('注册成功！');
        await loadAllData();
        return user;
      } catch (e) {
        toast('注册失败：' + e.message, 'error');
        throw e;
      }
    }

    async function signIn(username, password) {
      try {
        const user = await userbase.signIn({ username, password, rememberMe: 'session' });
        currentUser = user;
        await loadUserInfo(user.username);
        isAdmin = (user.username === ADMIN_USERNAME);
        updateUIForLoggedIn();
        if (!currentUserInfo || !currentUserInfo.email || !currentUserInfo.displayName) {
          openModal('first-setup-modal');
        }
        toast('登录成功！');
        await loadAllData();
        return user;
      } catch (e) {
        toast('登录失败：' + e.message, 'error');
        throw e;
      }
    }

    async function signOut() {
      try {
        await userbase.signOut();
        currentUser = null;
        currentUserInfo = null;
        isAdmin = false;
        updateUIForLoggedOut();
        toast('已退出');
        await loadAllData();
      } catch (e) {
        toast('退出失败：' + e.message, 'error');
      }
    }

    function showLoginModal() { openModal('login-modal'); }

    function showSignupModal() { openModal('signup-modal'); }

    function openSettings() {
      if (!currentUser) return;
      document.getElementById('settings-displayname').value = currentUserInfo ? currentUserInfo.displayName || '' : '';
      document.getElementById('settings-email').value = currentUserInfo ? currentUserInfo.email || '' : '';
      openModal('settings-modal');
    }

    async function saveSettings() {
      const displayName = document.getElementById('settings-displayname').value.trim();
      const email = document.getElementById('settings-email').value.trim();
      if (!email) { toast('邮箱不能为空', 'error'); return; }
      if (!email.includes('@')) { toast('邮箱格式不正确', 'error'); return; }
      if (!displayName) { toast('显示名不能为空', 'error'); return; }
      const taken = await isEmailTaken(email, currentUser.username);
      if (taken) {
        toast('该邮箱已被其他用户使用', 'error');
        return;
      }
      try {
        await saveUserInfo({ username: currentUser.username, email, displayName });
        currentUserInfo = { ...currentUserInfo, email, displayName };
        updateUIForLoggedIn();
        closeModal('settings-modal');
        toast('设置已保存');
      } catch (e) {
        toast('保存失败：' + e.message, 'error');
      }
    }

    document.getElementById('settings-save').addEventListener('click', saveSettings);

    document.getElementById('first-submit').addEventListener('click', async function() {
      const displayName = document.getElementById('first-displayname').value.trim();
      const email = document.getElementById('first-email').value.trim();
      if (!email) { toast('邮箱不能为空', 'error'); return; }
      if (!email.includes('@')) { toast('邮箱格式不正确', 'error'); return; }
      if (!displayName) { toast('显示名不能为空', 'error'); return; }
      const taken = await isEmailTaken(email, currentUser.username);
      if (taken) {
        toast('该邮箱已被其他用户使用', 'error');
        return;
      }
      try {
        await saveUserInfo({ username: currentUser.username, email, displayName });
        currentUserInfo = { ...currentUserInfo, email, displayName };
        updateUIForLoggedIn();
        closeModal('first-setup-modal');
        toast('信息已完善');
      } catch (e) {
        toast('保存失败：' + e.message, 'error');
      }
    });

    document.getElementById('login-submit').addEventListener('click', async function() {
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value.trim();
      if (!username || !password) { toast('请填写完整'); return; }
      await signIn(username, password);
      closeModal('login-modal');
      document.getElementById('login-username').value = '';
      document.getElementById('login-password').value = '';
    });

    document.getElementById('signup-submit').addEventListener('click', async function() {
      const username = document.getElementById('signup-username').value.trim();
      const email = document.getElementById('signup-email').value.trim();
      const password = document.getElementById('signup-password').value.trim();
      if (!username || !email || !password) { toast('请填写完整'); return; }
      if (password.length < 6) { toast('密码至少6位'); return; }
      if (!email.includes('@')) { toast('邮箱格式不正确'); return; }
      await signUp(username, password, email);
      closeModal('signup-modal');
      document.getElementById('signup-username').value = '';
      document.getElementById('signup-email').value = '';
      document.getElementById('signup-password').value = '';
    });

    document.getElementById('login-password').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') document.getElementById('login-submit').click();
    });
    document.getElementById('signup-password').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') document.getElementById('signup-submit').click();
    });

    function renderAnnouncements() {
      const container = document.getElementById('announce-text');
      const empty = document.getElementById('announce-empty');
      while (container.children.length > 2) {
        container.removeChild(container.lastChild);
      }
      if (!announcements.length) {
        empty.style.display = 'inline';
        return;
      }
      empty.style.display = 'none';
      announcements.forEach((ann, index) => {
        const wrapper = document.createElement('span');
        wrapper.className = 'ann-item';
        wrapper.innerHTML = `
          <span>${escHtml(ann.text)}</span>
          ${isAdmin ? `<span class="del-ann" data-id="${ann.id}" data-index="${index}">✕</span>` : ''}
        `;
        container.appendChild(wrapper);
      });
      document.querySelectorAll('.del-ann').forEach(el => {
        el.addEventListener('click', async function(e) {
          e.stopPropagation();
          if (!isAdmin) { toast('权限不足'); return; }
          const id = this.dataset.id;
          if (!confirm('删除此公告？')) return;
          try {
            await deleteItem('announcement', id);
            toast('公告已删除');
          } catch (err) {
            toast('删除失败：' + err.message, 'error');
          }
        });
      });
    }

    document.getElementById('announce-post').addEventListener('click', async function() {
      if (!isAdmin) { toast('请先登录管理员账号'); return; }
      const input = document.getElementById('announce-input');
      const text = input.value.trim();
      if (!text) { toast('请输入公告内容'); return; }
      try {
        const newAnn = {
          id: genId(),
          text: text,
          date: Date.now()
        };
        await upsertItem('announcement', newAnn);
        input.value = '';
        toast('公告发布成功');
      } catch (err) {
        toast('发布失败：' + err.message, 'error');
      }
    });

    document.getElementById('announce-input').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        document.getElementById('announce-post').click();
      }
    });

    async function addArtwork(artworkData) {
      try {
        await upsertItem('artwork', artworkData);
        toast('上传成功！');
      } catch (err) {
        toast('上传失败：' + err.message, 'error');
        throw err;
      }
    }

    async function deleteArtwork(id) {
      try {
        await deleteItem('artwork', id);
        toast('已删除');
      } catch (err) {
        toast('删除失败：' + err.message, 'error');
        throw err;
      }
    }

    async function toggleLike(artId) {
      if (!currentUser) { toast('请先登录'); return false; }
      const art = artworks.find(a => a.id === artId);
      if (!art) return false;
      const likes = art.likes || [];
      const idx = likes.indexOf(currentUser.username);
      if (idx > -1) {
        likes.splice(idx, 1);
      } else {
        likes.push(currentUser.username);
      }
      art.likes = likes;
      try {
        await upsertItem('artwork', art, art.id);
        return true;
      } catch (err) {
        toast('点赞更新失败：' + err.message, 'error');
        return false;
      }
    }

    function isLiked(artId) {
      if (!currentUser) return false;
      const art = artworks.find(a => a.id === artId);
      if (!art) return false;
      return (art.likes || []).includes(currentUser.username);
    }

    function getLikeCount(artId) {
      const art = artworks.find(a => a.id === artId);
      if (!art) return 0;
      return (art.likes || []).length;
    }

    function setupSearchSuggestions() {
      const input = document.getElementById('search-input');
      const sugg = document.getElementById('suggestions');
      input.addEventListener('input', function() {
        const val = this.value.trim().toLowerCase();
        if (!val) { sugg.style.display = 'none'; return; }
        const matches = artworks.filter(a => a.title.toLowerCase().includes(val)).slice(0, 8);
        if (!matches.length) { sugg.style.display = 'none'; return; }
        sugg.innerHTML = matches.map(a => `<div class="sug-item" data-title="${escHtml(a.title)}">${escHtml(a.title)}</div>`)
          .join('');
        sugg.style.display = 'block';
        sugg.querySelectorAll('.sug-item').forEach(el => {
          el.addEventListener('click', function() {
            input.value = this.dataset.title;
            sugg.style.display = 'none';
            searchQuery = input.value.trim().toLowerCase();
            applyFilters();
          });
        });
      });
      document.addEventListener('click', function(e) {
        if (!document.getElementById('search-wrap').contains(e.target)) sugg.style.display = 'none';
      });
      input.addEventListener('input', function() {
        searchQuery = this.value.trim().toLowerCase();
        applyFilters();
      });
    }

    let filtered = [];
    let currentTag = 'all';
    let currentSort = 'newest';
    let searchQuery = '';
    let currentDetailArt = null;
    let isLikedView = false;

    function applyFilters() {
      let arr = [...artworks];
      if (currentTag !== 'all') arr = arr.filter(a => a.tag === currentTag);
      if (searchQuery) arr = arr.filter(a => a.title.toLowerCase().includes(searchQuery) || (a.desc || '').toLowerCase()
        .includes(searchQuery));
      if (currentSort === 'newest') arr.sort((a, b) => b.date - a.date);
      if (currentSort === 'oldest') arr.sort((a, b) => a.date - b.date);
      if (currentSort === 'title') arr.sort((a, b) => a.title.localeCompare(b.title, 'zh'));
      if (isLikedView) {
        arr = arr.filter(a => a.likes && a.likes.includes(currentUser ? currentUser.username : ''));
      }
      filtered = arr;
      renderGallery();
      renderLikedStrip();
    }

    function showSkeletons(n = 8) {
      document.getElementById('gallery').innerHTML = Array.from({ length: n }, () =>
        `<div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-body"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>`
      ).join('');
    }

    function renderGallery() {
      const g = document.getElementById('gallery');
      if (!filtered.length) {
        g.innerHTML =
        `<div class="empty"><div class="empty-icon">🖼️</div><p>${artworks.length===0?'还没有作品':'没有匹配的作品'}</p></div>`;
        return;
      }
      g.innerHTML = '';
      filtered.forEach((art, idx) => {
        const liked = isLiked(art.id);
        const likeCount = getLikeCount(art.id);
        const card = document.createElement('div');
        card.className = 'artwork-card';
        card.innerHTML = `
          <div class="card-img-wrap">
            <img src="${escHtml(art.imageUrl)}" alt="${escHtml(art.title)}" loading="lazy" />
            <span class="card-tag">${escHtml(art.tag)}</span>
          </div>
          <div class="card-info">
            <div class="card-left">
              <div class="card-title">${escHtml(art.title)}</div>
              <div class="card-meta">${fmtDate(art.date)}</div>
            </div>
            <button class="heart-btn ${liked?'liked':''}" data-id="${art.id}">
              ${liked ? '❤️' : '🤍'}
              <span class="heart-count">${likeCount}</span>
            </button>
          </div>
        `;
        card.querySelector('.heart-btn').addEventListener('click', async (e) => {
          e.stopPropagation();
          const id = e.currentTarget.dataset.id;
          if (!currentUser) { toast('请先登录'); return; }
          const success = await toggleLike(id);
          if (success) {
            applyFilters();
          }
        });
        card.addEventListener('click', () => {
          openDetail(idx);
          addRecent(art);
        });
        g.appendChild(card);
      });
    }

    function renderRecentStrip() {
      const container = document.getElementById('recent-list');
      const recent = getRecent();
      if (!recent.length) {
        container.innerHTML = '<span class="strip-empty">还没有浏览记录</span>';
        return;
      }
      container.innerHTML = recent.map(item => `
        <div class="strip-item" data-id="${item.id}">
          <img src="${escHtml(item.imagePath)}" alt="${escHtml(item.title)}" loading="lazy" />
          <div class="si-title">${escHtml(item.title)}</div>
        </div>
      `).join('');
      container.querySelectorAll('.strip-item').forEach(el => {
        const id = el.dataset.id;
        const art = artworks.find(a => a.id === id);
        if (art) el.addEventListener('click', () => openDetail(artworks.indexOf(art)));
      });
    }

    function renderLikedStrip() {
      const container = document.getElementById('liked-list');
      if (!currentUser) {
        container.innerHTML = '<span class="strip-empty">登录后可查看喜欢</span>';
        return;
      }
      const likedArts = artworks.filter(a => a.likes && a.likes.includes(currentUser.username));
      if (!likedArts.length) {
        container.innerHTML = '<span class="strip-empty">还没有喜欢的作品</span>';
        return;
      }
      container.innerHTML = likedArts.map(art => `
        <div class="strip-item" data-id="${art.id}">
          <img src="${escHtml(art.imageUrl)}" alt="${escHtml(art.title)}" loading="lazy" />
          <div class="si-title">${escHtml(art.title)}</div>
        </div>
      `).join('');
      container.querySelectorAll('.strip-item').forEach(el => {
        const id = el.dataset.id;
        const art = artworks.find(a => a.id === id);
        if (art) el.addEventListener('click', () => openDetail(artworks.indexOf(art)));
      });
    }

    function showLikedView() {
      if (!currentUser) { toast('请先登录'); return; }
      isLikedView = true;
      applyFilters();
      document.getElementById('main-header').classList.add('hidden');
      document.getElementById('tags-bar').classList.add('hidden');
      document.getElementById('recent-strip').classList.add('hidden');
      document.getElementById('liked-strip').classList.add('hidden');
      document.getElementById('view-back-bar').classList.add('show');
      document.getElementById('view-title').textContent = '❤️ 我喜欢';
      document.querySelectorAll('.tag-pill').forEach(b => b.classList.remove('active'));
    }

    function exitLikedView() {
      isLikedView = false;
      document.getElementById('main-header').classList.remove('hidden');
      document.getElementById('tags-bar').classList.remove('hidden');
      document.getElementById('recent-strip').classList.remove('hidden');
      document.getElementById('liked-strip').classList.remove('hidden');
      document.getElementById('view-back-bar').classList.remove('show');
      document.querySelectorAll('.tag-pill').forEach(b => b.classList.remove('active'));
      document.querySelector('.tag-pill[data-tag="all"]').classList.add('active');
      currentTag = 'all';
      applyFilters();
    }

    function openDetail(idx) {
      const art = filtered[idx];
      if (!art) return;
      currentDetailArt = art;

      document.getElementById('main-view').classList.add('hidden');
      document.getElementById('detail-view').classList.add('open');
      document.body.style.overflow = 'auto';

      document.getElementById('detail-title').textContent = art.title;
      document.getElementById('detail-image').src = art.imageUrl;
      document.getElementById('detail-tag').textContent = art.tag;
      document.getElementById('detail-title-text').textContent = art.title;
      document.getElementById('detail-date').textContent = '发布于 ' + fmtDate(art.date);
      document.getElementById('detail-desc').textContent = art.desc || '暂无描述';
      document.getElementById('detail-uploader').textContent = art.uploader || '未知';

      const liked = isLiked(art.id);
      const heartBtn = document.getElementById('detail-heart');
      heartBtn.innerHTML = `${liked ? '❤️' : '🤍'} <span class="detail-heart-count">${getLikeCount(art.id)}</span>`;
      heartBtn.classList.toggle('liked', liked);

      const delBtn = document.getElementById('detail-delete');
      delBtn.style.display = (isAdmin || (currentUser && currentUser.username === art.uploader)) ? 'block' : 'none';
      delBtn.dataset.id = art.id;

      loadGiscus(art.id);

      document.getElementById('detail-view').scrollTop = 0;
      window.scrollTo(0, 0);

      const wrap = document.getElementById('detail-image-wrap');
      const img = document.getElementById('detail-image');
      wrap.classList.remove('zoomed');
      img.style.transform = 'scale(1)';
      wrap.onclick = function(e) {
        e.stopPropagation();
        this.classList.toggle('zoomed');
        if (this.classList.contains('zoomed')) {
          img.style.transform = 'scale(1.8)';
        } else {
          img.style.transform = 'scale(1)';
        }
      };
    }

    function closeDetail() {
      document.getElementById('detail-view').classList.remove('open');
      document.getElementById('main-view').classList.remove('hidden');
      document.body.style.overflow = 'auto';
      document.getElementById('giscus-container').innerHTML = '';
      currentDetailArt = null;
      if (isLikedView) {
        showLikedView();
      }
    }

    let pickedFile = null,
      pickedDataUrl = null;
    const fileInput = document.getElementById('file-input');
    const dropZone = document.getElementById('drop-zone');
    const previewImg = document.getElementById('preview-img');
    const previewWrap = document.getElementById('preview-wrap');

    function handlePick(file) {
      if (!file || !file.type.startsWith('image/')) return toast('请选择图片文件', 'error');
      if (file.size > 20 * 1024 * 1024) return toast('图片最大20MB', 'error');
      pickedFile = file;
      const reader = new FileReader();
      reader.onload = e => {
        pickedDataUrl = e.target.result;
        previewImg.src = pickedDataUrl;
        previewWrap.style.display = 'block';
        dropZone.style.display = 'none';
      };
      reader.readAsDataURL(file);
    }

    fileInput.addEventListener('change', e => handlePick(e.target.files[0]));
    dropZone.addEventListener('dragover', e => { e.preventDefault();
      dropZone.classList.add('drag'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag'));
    dropZone.addEventListener('drop', e => { e.preventDefault();
      dropZone.classList.remove('drag');
      handlePick(e.dataTransfer.files[0]); });
    document.getElementById('preview-remove').addEventListener('click', () => {
      pickedFile = null;
      pickedDataUrl = null;
      previewImg.src = '';
      previewWrap.style.display = 'none';
      dropZone.style.display = '';
      fileInput.value = '';
    });

    document.getElementById('upload-btn').addEventListener('click', () => {
      if (!currentUser) { toast('请先登录'); return; }
      openModal('upload-modal');
    });
    document.getElementById('upload-cancel').addEventListener('click', () => closeModal('upload-modal'));
    document.getElementById('upload-close').addEventListener('click', () => closeModal('upload-modal'));

    function resetUploadForm() {
      pickedFile = null;
      pickedDataUrl = null;
      fileInput.value = '';
      previewImg.src = '';
      previewWrap.style.display = 'none';
      dropZone.style.display = '';
      document.getElementById('art-title').value = '';
      document.getElementById('art-desc').value = '';
      document.getElementById('art-tag').value = '油画';
      document.getElementById('upload-progress').style.display = 'none';
      document.getElementById('progress-fill').style.width = '0%';
    }

    function setProgress(pct, label) {
      document.getElementById('upload-progress').style.display = 'block';
      document.getElementById('progress-fill').style.width = pct + '%';
      document.getElementById('progress-text').textContent = label;
    }

    async function uploadToImgBB(file) {
      const formData = new FormData();
      formData.append('key', IMGBB_API_KEY);
      formData.append('image', file);
      const response = await fetch('https://api.imgbb.com/1/upload', {
        method: 'POST',
        body: formData
      });
      const data = await response.json();
      if (data.success) {
        return data.data.url;
      } else {
        throw new Error(data.error?.message || 'ImgBB 上传失败');
      }
    }

    document.getElementById('upload-submit').addEventListener('click', async function() {
      if (!currentUser) { toast('请先登录'); return; }
      const title = document.getElementById('art-title').value.trim();
      const tag = document.getElementById('art-tag').value;
      const desc = document.getElementById('art-desc').value.trim();
      if (!pickedFile) { toast('请选择图片', 'error'); return; }
      if (!title) { toast('请输入标题', 'error'); return; }
      if (IMGBB_API_KEY === '你的ImgBB_API_Key') {
        toast('请先替换代码中的 ImgBB API Key', 'error');
        return;
      }

      const btn = this;
      btn.disabled = true;
      btn.textContent = '上传中…';

      try {
        setProgress(20, '读取图片…');
        setProgress(40, '上传到图床…');
        const imageUrl = await uploadToImgBB(pickedFile);

        setProgress(70, '保存到数据库…');
        const artworkData = {
          id: genId(),
          title,
          tag,
          desc,
          date: Date.now(),
          imageUrl: imageUrl,
          uploader: currentUser.username,
          likes: []
        };
        await addArtwork(artworkData);
        setProgress(100, '完成！');
        setTimeout(() => {
          closeModal('upload-modal');
          resetUploadForm();
          toast('作品发布成功！', 'success');
        }, 500);
      } catch (e) {
        toast('上传失败：' + e.message, 'error');
        console.error(e);
      } finally {
        btn.disabled = false;
        btn.textContent = '发布';
      }
    });

    document.getElementById('detail-heart').addEventListener('click', async function() {
      const art = currentDetailArt;
      if (!art) return;
      if (!currentUser) { toast('请先登录'); return; }
      const success = await toggleLike(art.id);
      if (success) {
        applyFilters();
        const idx = filtered.indexOf(art);
        if (idx > -1) openDetail(idx);
      }
    });

    document.getElementById('detail-delete').addEventListener('click', async function() {
      const art = currentDetailArt;
      if (!art) return;
      if (!isAdmin && !(currentUser && currentUser.username === art.uploader)) {
        toast('权限不足');
        return;
      }
      if (!confirm('删除此作品？')) return;
      try {
        await deleteArtwork(art.id);
        closeDetail();
        applyFilters();
        toast('已删除');
      } catch (e) {
        toast('删除失败：' + e.message, 'error');
      }
    });

    function loadGiscus(artId) {
      const container = document.getElementById('giscus-container');
      container.innerHTML = '';
      setTimeout(() => {
        const term = `gallery-${artId}`;
        const script = document.createElement('script');
        script.src = 'https://giscus.app/client.js';
        script.setAttribute('data-repo', GISCUS_CONFIG.repo);
        script.setAttribute('data-repo-id', GISCUS_CONFIG.repoId);
        script.setAttribute('data-category', GISCUS_CONFIG.category);
        script.setAttribute('data-category-id', GISCUS_CONFIG.categoryId);
        script.setAttribute('data-mapping', 'term');
        script.setAttribute('data-term', term);
        script.setAttribute('data-strict', GISCUS_CONFIG.strict);
        script.setAttribute('data-reactions-enabled', GISCUS_CONFIG.reactionsEnabled);
        script.setAttribute('data-emit-metadata', GISCUS_CONFIG.emitMetadata);
        script.setAttribute('data-input-position', GISCUS_CONFIG.inputPosition);
        script.setAttribute('data-theme', GISCUS_CONFIG.theme);
        script.setAttribute('data-lang', GISCUS_CONFIG.lang);
        script.setAttribute('data-loading', GISCUS_CONFIG.loading);
        script.crossOrigin = 'anonymous';
        script.async = true;
        container.appendChild(script);
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = 'https://giscus.app/default.css';
        container.appendChild(link);
      }, 300);
    }

    document.querySelector('.logo').addEventListener('dblclick', function() {
      document.getElementById('search-input').value = '';
      searchQuery = '';
      document.querySelectorAll('.tag-pill').forEach(b => b.classList.remove('active'));
      document.querySelector('.tag-pill[data-tag="all"]').classList.add('active');
      currentTag = 'all';
      if (document.getElementById('detail-view').classList.contains('open')) {
        closeDetail();
      }
      if (isLikedView) {
        exitLikedView();
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
      toast('已返回首页');
    });

    document.getElementById('view-back-btn').addEventListener('click', exitLikedView);
    document.getElementById('liked-more').addEventListener('click', showLikedView);
    document.getElementById('detail-back').addEventListener('click', closeDetail);

    document.querySelectorAll('.tag-pill').forEach(btn => {
      btn.addEventListener('click', () => {
        if (isLikedView) {
          exitLikedView();
        }
        document.querySelectorAll('.tag-pill').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentTag = btn.dataset.tag;
        applyFilters();
      });
    });
    document.getElementById('sort-select').addEventListener('change', e => { currentSort = e.target.value;
      applyFilters(); });

    function openModal(id) { document.getElementById(id).classList.add('open');
      document.body.style.overflow = 'hidden'; }

    function closeModal(id) { document.getElementById(id).classList.remove('open');
      document.body.style.overflow = ''; }
    ['upload-modal', 'login-modal', 'signup-modal', 'settings-modal', 'first-setup-modal'].forEach(id => {
      document.getElementById(id).addEventListener('click', e => {
        if (e.target === document.getElementById(id)) closeModal(id);
      });
    });

    let toastTimer;

    function toast(msg, type = '') {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = 'show' + (type ? ' ' + type : '');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.className = '', 2500);
    }

    function escHtml(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function fmtDate(ts) {
      return new Date(ts).toLocaleDateString('zh-CN', { year: 'numeric', month: 'short', day: 'numeric' });
    }

    setupSearchSuggestions();
    initUserbase();
  </script>
</body>
</html>
